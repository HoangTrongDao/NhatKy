services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newbeginning
      POSTGRES_USER: newbeginning
      POSTGRES_PASSWORD: newbeginning_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newbeginning -d newbeginning"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://newbeginning:newbeginning_dev_password@db:5432/newbeginning
      JWT_SECRET_KEY: dev-only-change-this-secret-before-deployment
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
